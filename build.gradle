plugins {
    // Compiles src/main/java (Gradle's default Java layout, which this
    // project already follows) and adds standard build/check tasks.
    id 'java'
    // Adds the 'run' task, so `./gradlew run` launches the app directly.
    id 'application'
}

java {
    toolchain {
        // Matches this project's required Java version (see AGENTS.md).
        // Gradle will use an installed JDK 25 if one is on this machine,
        // or auto-provision one, rather than whatever JDK happens to be
        // first on PATH.
        languageVersion = JavaLanguageVersion.of(25)
    }
}

application {
    mainClass = 'bot.Bot'
}

tasks.named('run') {
    // Bot is an interactive console program (it reads commands via
    // Scanner(System.in)); without this, Gradle's 'run' task doesn't
    // forward the terminal's/pipe's standard input to the child JVM at
    // all, so the program would fail immediately on its first read.
    standardInput = System.in
}

repositories {
    mavenCentral()
}
